name: Independent ISO 20022 example validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pinned-open-source-examples:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Verify pinned public corpus, hashes, record counts and sums
        run: python examples/external_corpus_validation.py
