name: one-time source formatting
on:
  push:
    paths:
      - '.github/workflows/one-time-ruff.yml'
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message == 'chore: run one-time source formatting'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tools
        run: python -m pip install -e '.[dev]'
      - name: Apply mechanical fixes
        run: |
          ruff check --fix src tests examples
          ruff format src tests examples
          ruff check src tests examples
          pytest -q
      - name: Commit validated formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests examples
          if ! git diff --cached --quiet; then
            git commit -m 'style: apply Ruff fixes and normalize imports'
            git push
          fi
