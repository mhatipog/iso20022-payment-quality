name: tests
on:
  workflow_dispatch:
  push:
  pull_request:
permissions:
  contents: write
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: ruff check --fix src tests examples
      - run: ruff format src tests examples
      - run: ruff check src tests examples
      - run: pytest -q
      - name: Commit one-time formatting
        if: github.event_name == 'push'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests examples
          if ! git diff --cached --quiet; then
            git commit -m 'style: normalize banking package imports and formatting'
            git push
          fi
  spark-integration:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python -m pip install -e '.[spark,dev]'
      - run: pytest -q tests/test_spark_optional.py

  public-bank-compatibility:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python examples/public_bank_smoke.py
