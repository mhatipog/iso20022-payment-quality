name: tests
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  workflow_dispatch:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Verify offline examples, Python tests and coverage
        run: python scripts/verify.py
      - name: Publish coverage evidence
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: python-core-coverage
          path: coverage.xml
      - name: Build an isolated wheel and smoke-test imports/CLI
        if: matrix.python-version == '3.12'
        run: |
          python -m build --wheel
          python -m venv /tmp/iso20022-wheel-check
          /tmp/iso20022-wheel-check/bin/python -m pip install dist/*.whl
          (cd /tmp && /tmp/iso20022-wheel-check/bin/python -c "from importlib.metadata import version; from iso20022_quality import MigrationControls, assess_migration_gate; assert version('iso20022-payment-quality') == '0.3.0'; print('isolated wheel import OK')")
          (cd /tmp && /tmp/iso20022-wheel-check/bin/iso20022-quality --help > /dev/null)

  spark-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python -m pip install -e '.[spark,dev]'
      - run: pytest -q tests/test_spark_optional.py
      - name: Verify 20k Spark reconciliation benchmark
        run: |
          python -c "from pyspark.sql import SparkSession; from benchmarks.spark_reconciliation import run; s=SparkSession.builder.master('local[2]').config('spark.sql.shuffle.partitions','4').appName('banking-ci-bench').getOrCreate(); print(run(s, 20000)); s.stop()"

  public-bank-compatibility:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/validation/2026-10-27-bank-samples')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python examples/public_bank_smoke.py
