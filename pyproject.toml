[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iso20022-payment-quality"
version = "0.2.1"
description = "ISO 20022 payment status, bank statement and reconciliation quality for Python and Spark"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Metin Hatipogullari"}]
keywords = ["ISO 20022", "SEPA", "PySpark", "Databricks", "reconciliation", "banking"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only", "Topic :: Office/Business :: Financial :: Accounting", "License :: OSI Approved :: Apache Software License"]
dependencies = ["defusedxml>=0.7.1,<1"]

[project.scripts]
iso20022-quality = "iso20022_quality.cli:main"

[project.optional-dependencies]
spark = ["pyspark>=3.4,<5"]
dev = ["pytest>=8", "ruff>=0.6", "build>=1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
